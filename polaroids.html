<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Pics</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            cursor: pointer; /* Indicate clickable */
        }
        #container {
            position: relative;
            width: 100%;
            height: 100%;
        }
        .polaroid {
            position: absolute;
            background-color: white;
            border: 10px solid white;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            padding: 10px;
            transform: rotate(-5deg);
            cursor: pointer;
            transition: transform 0.5s ease;
            opacity: 0;
            animation: popIn 0.5s forwards;
            max-width: 90vw; /* Ensure it doesn't exceed screen width */
            max-height: 90vh; /* Ensure it doesn't exceed screen height */
        }
        .polaroid img {
            width: 100%; /* Make image responsive */
            height: auto; /* Maintain aspect ratio */
            max-width: 200px; /* Cap at 200px on larger screens */
            max-height: 200px;
            display: block;
        }
        .polaroid p {
            text-align: center;
            margin: 10px 0 0 0;
            font-size: 14px;
            color: #333;
        }
        @keyframes popIn {
            0% { transform: scale(0) rotate(-5deg); opacity: 0; }
            100% { transform: scale(1) rotate(-5deg); opacity: 1; }
        }
        .explanation {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0,0,0,0.8);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            display: none;
            z-index: 10;
            max-width: 90vw; /* Responsive on mobile */
            box-sizing: border-box;
        }
        .explanation.show {
            display: block;
        }
        #startText {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0,0,0,0.8);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            z-index: 10;
            font-size: 18px;
            max-width: 90vw; /* Responsive */
            box-sizing: border-box;
        }
        #endText {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0,0,0,0.8);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            z-index: 10;
            font-size: 18px;
            display: none;
            max-width: 90vw; /* Responsive */
            box-sizing: border-box;
        }
        /* Mobile-specific adjustments */
        @media (max-width: 768px) {
            .polaroid {
                padding: 5px; /* Reduce padding on mobile */
                border: 5px solid white; /* Thinner border */
            }
            .polaroid img {
                max-width: 150px; /* Smaller images on mobile */
                max-height: 150px;
            }
            .polaroid p {
                font-size: 12px; /* Smaller text */
            }
            .explanation, #startText, #endText {
                padding: 15px; /* Less padding */
                font-size: 16px; /* Smaller font for start text */
            }
        }
    </style>
</head>
<body>
    <div id="startText">Click anywhere to move forward</div>
    <div id="container"></div>
    <div id="explanation" class="explanation"></div>
    <div id="endText">Click anywhere to move forward</div>

    <script>
        const polaroids = [
            {
                image: 'images/image1.jpg',
                explanation: 'Here\'s a pic from your debut, where we danced for the first time.'
            },
            {
                image: 'images/image3.jpg',
                explanation: 'Here\'s a pic from our graduation, and one of our last days in MaSci.'
            },
            {
                image: 'images/image4.jpeg',
                explanation: 'Here\'s a pic from one of our last dates before college started.'
            },
            {
                image: 'images/image5.jpeg',
                explanation: 'This is a pic I loved from our gradball, where I gave you my first ever bouquet of flowers.'
            },
            {
                image: 'images/image6.jpeg',
                explanation: 'And here\'s a pic from the day I asked if I could court you, which was also my first time baking.'
            }
        ];

        let currentIndex = 0;
        let started = false;
        let waitingForNext = false;
        let finished = false;
        const container = document.getElementById('container');
        const explanationDiv = document.getElementById('explanation');
        const startText = document.getElementById('startText');
        const endText = document.getElementById('endText');

        function showPolaroid(index) {
            const polaroid = document.createElement('div');
            polaroid.className = 'polaroid';
            polaroid.innerHTML = `
                <img src="${polaroids[index].image}" alt="Polaroid ${index + 1}">
                <p>Polaroid ${index + 1}</p>
            `;
            // Spread out more: use 10-90% range for better distribution
            polaroid.style.left = `${Math.random() * 80 + 10}%`;
            polaroid.style.top = `${Math.random() * 80 + 10}%`;
            polaroid.addEventListener('click', () => {
                explanationDiv.textContent = polaroids[index].explanation;
                explanationDiv.classList.add('show');
                setTimeout(() => {
                    explanationDiv.classList.remove('show');
                    if (currentIndex < polaroids.length - 1) {
                        waitingForNext = true;
                    } else {
                        finished = true;
                        endText.style.display = 'block';
                    }
                }, 3000); // Show explanation for 3 seconds
            });
            container.appendChild(polaroid);
        }

        document.body.addEventListener('click', () => {
            if (!started) {
                started = true;
                startText.style.display = 'none';
                showPolaroid(currentIndex);
            } else if (waitingForNext) {
                waitingForNext = false;
                currentIndex++;
                if (currentIndex < polaroids.length) {
                    showPolaroid(currentIndex);
                }
            } else if (finished) {
                window.location.href = 'cake.html';
            }
        });
    </script>
</body>
</html>
